stages:
  - deploy

.deploy_frontend_template:
  stage: deploy
  image:
    name: node:22-alpine
    pull_policy: if-not-present
  tags:
    - prod-deploy
  before_script:
    - apk add --no-cache openssh-client rsync
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_DIR"
    - test -n "$DEPLOY_SSH_PRIVATE_KEY"
    - echo "Deploy target ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PORT:-22}, dir=${DEPLOY_DIR}"
    - eval "$(ssh-agent -s)"
    - chmod 400 "$DEPLOY_SSH_PRIVATE_KEY"
    - ssh-add "$DEPLOY_SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - npm config set registry https://registry.npmmirror.com
    - npm ci --no-audit --no-fund
    - npm run build
    - ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR/frontend/dist'"
    - rsync -az --delete -e "ssh -p ${DEPLOY_PORT:-22}" dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/frontend/dist/"
    - |
      ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "
        set -e
        DEPLOY_DIR='$DEPLOY_DIR'
        cd \"\$DEPLOY_DIR\"
        docker compose up -d --build --no-deps frontend
        docker image prune -f
      "

deploy_frontend_auth:
  extends: .deploy_frontend_template
  variables:
    DEPLOY_HOST: "192.168.200.53"
    DEPLOY_PORT: "22"
    DEPLOY_USER: "dyroot"
    DEPLOY_DIR: "/home/dyroot/workspace/data_analysis"
  rules:
    - if: '$CI_COMMIT_BRANCH == "auth_branch"'
      when: manual
  environment:
    name: auth-prod

deploy_frontend_without_auth:
  extends: .deploy_frontend_template
  variables:
    DEPLOY_HOST: "192.168.200.40"
    DEPLOY_PORT: "22"
    DEPLOY_USER: "root"
    DEPLOY_DIR: "/home/workspace/data_analysis"
  rules:
    - if: '$CI_COMMIT_BRANCH == "without_auth"'
      when: manual
  environment:
    name: noauth-prod
